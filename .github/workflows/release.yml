name: Release

# Builds the unsigned IPA and publishes it as a GitHub Release when a push to main starts with
# "release:" (scripts/release.sh makes that commit; its body is the release notes). Once the
# IPA is built and published, it adds the version's entry to altstore/apps.json, the AltStore /
# SideStore source, so the source never advertises an IPA that does not exist.
#
# workflow_dispatch re-runs the release for whatever version Info.plist currently has, e.g.
# after a failed build. It refuses to run if that version's release already exists. The notes
# input stands in for the commit body.

on:
  push:
    branches: [main]
    # Only a version bump can be a release, so other pushes never start (or skip) this workflow.
    paths: [Info.plist]
  workflow_dispatch:
    inputs:
      notes:
        description: Release notes (default "Version X.Y.Z.")
        required: false

permissions:
  contents: write   # create the release and tag, push the apps.json entry

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.event.head_commit.message, 'release:')
    # The project needs Xcode 27; this image ships it (arm64 only).
    runs-on: xcode-27
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Read version
        id: v
        run: |
          VERSION=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" Info.plist)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Read notes
        env:
          MSG: ${{ github.event.head_commit.message }}
          INPUT_NOTES: ${{ github.event.inputs.notes }}
        run: |
          # The commit body (everything after the subject and the blank line), else the input.
          NOTES=$(printf '%s\n' "$MSG" | tail -n +3)
          [ -n "$NOTES" ] || NOTES=$INPUT_NOTES
          [ -n "$NOTES" ] || NOTES="Version ${{ steps.v.outputs.version }}."
          printf '%s\n' "$NOTES" > "$RUNNER_TEMP/notes.txt"

      - name: Refuse to overwrite an existing release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${{ steps.v.outputs.tag }}" >/dev/null 2>&1; then
            echo "::error::Release ${{ steps.v.outputs.tag }} already exists"
            exit 1
          fi

      - name: Resolve packages
        run: xcodebuild -resolvePackageDependencies -project LNReader.xcodeproj -scheme LNReader

      - name: Build IPA
        run: ./scripts/build-ipa.sh release

      - name: Name the asset
        id: ipa
        run: |
          V=${{ steps.v.outputs.version }}
          mv "LNReader-$V-unsigned.ipa" "LNReader-$V.ipa"
          echo "path=LNReader-$V.ipa" >> "$GITHUB_OUTPUT"
          echo "size=$(stat -f%z "LNReader-$V.ipa")" >> "$GITHUB_OUTPUT"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.v.outputs.tag }}" "${{ steps.ipa.outputs.path }}" \
            --target "${{ github.sha }}" \
            --title "LNReader ${{ steps.v.outputs.version }}" \
            --notes-file "$RUNNER_TEMP/notes.txt"

      - name: Add the version to the source
        run: |
          git fetch origin main
          git checkout -B main origin/main
          V=${{ steps.v.outputs.version }}
          TAG=${{ steps.v.outputs.tag }}
          jq --arg v "$V" --arg b "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' Info.plist)" \
             --arg d "$(date -u +%Y-%m-%d)" --rawfile notes "$RUNNER_TEMP/notes.txt" \
             --arg url "https://github.com/${{ github.repository }}/releases/download/$TAG/LNReader-$V.ipa" \
             --argjson size "${{ steps.ipa.outputs.size }}" '
            .apps[0].versions |= ([{
              version: $v, buildVersion: $b, date: $d,
              localizedDescription: ($notes | rtrimstr("\n")),
              downloadURL: $url, size: $size, minOSVersion: "26.0"
            }] + map(select(.version != $v)))' \
            altstore/apps.json > altstore/apps.json.new
          mv altstore/apps.json.new altstore/apps.json
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "chore(altstore): add $TAG"
          git push origin main
